<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D7AFC"/>
      <stop offset="1" stop-color="#0747A6"/>
    </linearGradient>
  </defs>
  <rect width="144" height="144" rx="32" fill="url(#bg)"/>
  <!-- track: full ring -->
  <circle cx="72" cy="72" r="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="12"/>
  <!-- remaining time: ~70% arc, starts at 12 o'clock and runs clockwise -->
  <circle cx="72" cy="72" r="42" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="184.7 264" transform="rotate(-90 72 72)"/>
  <!-- clock hands -->
  <path d="M72 50 V72 L87 81" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="72" cy="72" r="5" fill="#FFAB00"/>
</svg>
